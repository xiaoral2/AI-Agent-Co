name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What are you trying to achieve? What is painful or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Optional sketch of CLI, config, or API.
    validations:
      required: true

  - type: textarea
    id: spec
    attributes:
      label: Spec alignment (optional)
      description: If this maps to `design_notes/ai-company-spec.md`, cite the section (§…).

  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this
          required: false
