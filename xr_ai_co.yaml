# XR-AI-Co configuration — §14, §17
# Copy to project root; override with env vars (ANTHROPIC_API_KEY, XR_AI_CO_MODEL).

llm:
  provider: anthropic
  model: claude-sonnet-4-20250514
  # api_key: set via ANTHROPIC_API_KEY env var (do NOT commit secrets)
  llm_call_timeout_sec: 120
  max_retries_transient_api: 3
  task_timeout_sec: 600
  # session_max_duration_sec: null  # optional hard session wall-clock

budget:
  max_tokens_per_task: 200000
  max_tokens_per_session: 2000000
  # max_cost_per_project: null  # optional USD cap (uses usd_per_1k_total_tokens or default 0.003)
  # usd_per_1k_total_tokens: 0.003
  max_retries_total: 50

policies:
  retry_policy:
    max_retries_per_task: 5
  scaling_policy:
    coder: 4
    tester: 4
    reviewer: 2
  parallelism_policy:
    max_concurrent_code_tasks: 2
  scheduler_policy: {}
  # sla_policy:
  #   # §2.5.3a — raise effective tier when deadline is within N hours (end of deadline date, UTC)
  #   deadline_high_within_hours: 168
  #   deadline_urgent_within_hours: 24
  sla_policy: {}
  failure_policy: {}
  # review_policy:
  #   code_success_gate: false   # true = §2.5.4 reviewer must approve before code task → done
  # git_policy:
  #   rollback_on_code_failure: false  # rollback workspace to last green test commit on code failure

# §2.5.6 optional PM pass (interactive runs only; use `xr-ai-co run --clarify` to force when not using -y)
pm:
  clarification_before_plan: false

# Stub planner: prepend Task.type design (T0) → code → test
planner:
  include_design_task: false

workspace: workspace
state_dir: state
decision_log_max_entries: 500
clamp_code_tasks_to_host: false
